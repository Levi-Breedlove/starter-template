<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246" role="img" aria-labelledby="overview-title overview-desc"><title id="overview-title">From idea to verified implementation</title><desc id="overview-desc">Consult, design and build, then verify. The project records retain the decisions and evidence.</desc><rect x="8" y="8" width="984" height="230" rx="24" fill="#11151B" stroke="#303A46"/><text x="36" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#F2C477" font-weight="700" >AWS STARTER TEMPLATE</text><text x="36" y="84" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" fill="#F6F8FA" font-weight="650" >From idea to verified implementation.</text><rect x="36" y="110" width="298" height="100" rx="13" fill="#1C242D" stroke="#394552"/><text x="52" y="136" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#F2C477" font-weight="650" >01</text><text x="52" y="167" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#F6F8FA" font-weight="650" >Consult</text><text x="52" y="192" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#B9C8D6" font-weight="400" >Define a useful outcome.</text><rect x="351" y="110" width="298" height="100" rx="13" fill="#1C242D" stroke="#394552"/><text x="367" y="136" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#F2C477" font-weight="650" >02</text><text x="367" y="167" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#F6F8FA" font-weight="650" >Design &amp; build</text><text x="367" y="192" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#B9C8D6" font-weight="400" >Turn decisions into tasks.</text><rect x="666" y="110" width="298" height="100" rx="13" fill="#1C242D" stroke="#394552"/><text x="682" y="136" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#F2C477" font-weight="650" >03</text><text x="682" y="167" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" fill="#F6F8FA" font-weight="650" >Verify</text><text x="682" y="192" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#B9C8D6" font-weight="400" >Keep evidence of the result.</text><path d="M338 160h10m-4-4 4 4-4 4 M653 160h10m-4-4 4 4-4 4" fill="none" stroke="#AAB6C2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
